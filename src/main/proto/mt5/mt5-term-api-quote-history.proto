syntax = "proto3";
option csharp_namespace = "mt5_term_api";
import "google/api/annotations.proto";
import "mt5/mrpc-mt5-error.proto";

package mt5_term_api;
option go_package = "git.mtapi.io/root/mrpc-proto.git/mt5/libraries/go";

// ============================================================================
// Quote history: the bars a chart is drawn from, and the ticks those bars are
// built from, for one symbol - returned by PAGE, oldest first.
//
// Both calls walk a time range forward. A page carries at most page_size items
// and, when the range holds more, a next_page_token; passing that token back
// (same symbol, timeframe/flags and range) returns the next page. An empty
// next_page_token means the range is exhausted. Tokens are opaque: a client
// stores and returns them, nothing else.
//
// History lives in the terminal and is fetched from the broker on demand. The
// first request for a symbol or a period the terminal has not loaded yet can
// take a few seconds, and when the broker has not delivered it within that
// time the call answers with an error whose error_code is
// QUOTE_HISTORY_NOT_READY - ask again a moment later. Nothing is served from
// a cache outside the terminal.
//
// Every call needs the terminal id header ("id"), like every other call.
// ============================================================================
service QuoteHistory {
  // OHLC bars (candles) of one symbol and timeframe, oldest first, by page.
  rpc Bars (QuoteHistoryBarsRequest) returns (QuoteHistoryBarsReply) {
    option (google.api.http) = {
      get: "/QuoteHistory/Bars"
    };
  }

  // Ticks of one symbol, oldest first, by page. MT5 keeps real tick history
  // (bid/ask/last with flags) for as far back as the broker provides it.
  rpc Ticks (QuoteHistoryTicksRequest) returns (QuoteHistoryTicksReply) {
    option (google.api.http) = {
      get: "/QuoteHistory/Ticks"
    };
  }
}

// Timeframe of a bar. The value is the bar length in MINUTES, which is also
// what MT4 calls these periods; the terminal maps it to MQL5's ENUM_TIMEFRAMES.
enum QUOTE_HISTORY_TIMEFRAME {
  QH_PERIOD_UNSPECIFIED = 0;
  QH_PERIOD_M1 = 1;
  QH_PERIOD_M2 = 2;
  QH_PERIOD_M3 = 3;
  QH_PERIOD_M4 = 4;
  QH_PERIOD_M5 = 5;
  QH_PERIOD_M6 = 6;
  QH_PERIOD_M10 = 10;
  QH_PERIOD_M12 = 12;
  QH_PERIOD_M15 = 15;
  QH_PERIOD_M20 = 20;
  QH_PERIOD_M30 = 30;
  QH_PERIOD_H1 = 60;
  QH_PERIOD_H2 = 120;
  QH_PERIOD_H3 = 180;
  QH_PERIOD_H4 = 240;
  QH_PERIOD_H6 = 360;
  QH_PERIOD_H8 = 480;
  QH_PERIOD_H12 = 720;
  QH_PERIOD_D1 = 1440;
  QH_PERIOD_W1 = 10080;
  QH_PERIOD_MN1 = 43200;
}

// ---------------------------------------------------------------- Bars

message QuoteHistoryBarsRequest {
  // Required. Broker symbol name, e.g. "EURUSD".
  string symbol = 1;

  // Required.
  QUOTE_HISTORY_TIMEFRAME timeframe = 2;

  // Required. Unix seconds (UTC) of the oldest bar wanted, inclusive. A time
  // before the broker's first bar is clamped to that first bar.
  int64 from_time = 3;
  int64 from_time_utc = 7;  // from_time in UTC: send either from_time or from_time_utc, not both.

  // Unix seconds (UTC) of the newest bar wanted, inclusive. 0 = now.
  int64 to_time = 4;
  int64 to_time_utc = 8;  // to_time in UTC: send either to_time or to_time_utc, not both.

  // Bars per page, 1..5000. 0 = 1000.
  int32 page_size = 5;

  // The next_page_token of the previous page, to continue; empty for the
  // first page. Must be used with the same symbol, timeframe and range.
  string page_token = 6;
}

message QuoteHistoryBarsReply {
  oneof response {
    QuoteHistoryBarsData data = 1;
    Error error = 2;
  }
}

message QuoteHistoryBarsData {
  string symbol = 1;
  QUOTE_HISTORY_TIMEFRAME timeframe = 2;

  // Oldest first. Empty when the range holds no bars.
  repeated QuoteHistoryBar bars = 3;

  // Pass back as page_token for the next page; empty when this was the last.
  string next_page_token = 4;

  // Unix seconds of the oldest bar the broker has for this symbol and
  // timeframe (0 when the terminal does not know yet).
  int64 server_first_time = 5;
  int64 server_first_time_utc = 6;  // server_first_time in UTC (the same moment; server_first_time is in the broker server's time zone).
}

// One bar (candle), named as MQL5 names the fields of MqlRates.
message QuoteHistoryBar {
  int64 time = 1;          // Unix seconds (UTC), bar open
  int64 time_utc = 9;  // time in UTC (the same moment; time is in the broker server's time zone).
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  int64 tick_volume = 6;   // ticks in the bar
  int32 spread = 7;        // points
  int64 real_volume = 8;   // exchange volume, 0 where the broker has none
}

// ---------------------------------------------------------------- Ticks

// Which ticks to return - MQL5's COPY_TICKS_* modes.
enum QUOTE_HISTORY_TICK_FLAGS {
  QH_TICKS_ALL = 0;    // every tick
  QH_TICKS_INFO = 1;   // ticks with bid and/or ask changes
  QH_TICKS_TRADE = 2;  // ticks with last and/or volume changes
}

message QuoteHistoryTicksRequest {
  // Required. Broker symbol name.
  string symbol = 1;

  // Required. Unix MILLISECONDS (UTC) of the oldest tick wanted, inclusive.
  int64 from_time_msc = 2;
  int64 from_time_msc_utc = 7;  // from_time_msc in UTC: send either from_time_msc or from_time_msc_utc, not both.

  // Unix milliseconds (UTC) of the newest tick wanted, inclusive. 0 = now.
  int64 to_time_msc = 3;
  int64 to_time_msc_utc = 8;  // to_time_msc in UTC: send either to_time_msc or to_time_msc_utc, not both.

  // Which ticks. Default: all.
  QUOTE_HISTORY_TICK_FLAGS flags = 4;

  // Ticks per page, 1..20000. 0 = 5000.
  int32 page_size = 5;

  // The next_page_token of the previous page; empty for the first page.
  string page_token = 6;
}

message QuoteHistoryTicksReply {
  oneof response {
    QuoteHistoryTicksData data = 1;
    Error error = 2;
  }
}

message QuoteHistoryTicksData {
  string symbol = 1;

  // Oldest first. Several ticks can share one millisecond; the order within
  // a millisecond is the terminal's.
  repeated QuoteHistoryTick ticks = 2;

  // Pass back as page_token for the next page; empty when this was the last.
  string next_page_token = 3;
}

// One tick, named as MQL5 names the fields of MqlTick.
message QuoteHistoryTick {
  int64 time_msc = 1;      // Unix milliseconds (UTC)
  int64 time_msc_utc = 8;  // time_msc in UTC (the same moment; time_msc is in the broker server's time zone).
  double bid = 2;
  double ask = 3;
  double last = 4;         // last deal price, 0 where the broker has none
  int64 volume = 5;        // last deal volume, 0 where the broker has none
  double volume_real = 6;  // last deal volume with greater accuracy
  int32 flags = 7;         // MQL5 TICK_FLAG_* bits: what changed in this tick
}
