syntax = "proto3";
option csharp_namespace = "mrpc_admin";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
package mrpc_admin;
option go_package = "git.mtapi.io/root/mrpc-proto.git/mt5/libraries/go";

// ============================================================
// Admin / diagnostics service.
// Auth via admin_key (matched against the ADMIN_KEY env setting).
// HTTP-transcoded for the /admin HTML page + cross-pod fan-out, but HIDDEN from
// Swagger (excluded in SwaggerGen DocInclusionPredicate in Program.cs).
// ============================================================
service AdminApi {
  // Active terminals running on THIS pod.
  rpc ActiveTerminals (ActiveTerminalsRequest) returns (ActiveTerminalsReply) {
    option (google.api.http) = { get: "/ActiveTerminals" };
  }

  // Active terminals across ALL pods of this StatefulSet/Deployment.
  // Lists peer pods via the Kubernetes API, then calls ActiveTerminals on each.
  rpc ActiveTerminalsCluster (ActiveTerminalsRequest) returns (ActiveTerminalsClusterReply) {
    option (google.api.http) = { get: "/ActiveTerminalsCluster" };
  }

  // Whole-machine CPU % and physical RAM (current + short history) for THIS pod.
  rpc SystemUsage (ActiveTerminalsRequest) returns (SystemUsageReply) {
    option (google.api.http) = { get: "/SystemUsage" };
  }

  // Lists the diagnostic log files on \\host.lan\Data\logs (mrpc.log, startup.log,
  // install.log, boot-diag.log, and any future additions) - the exact files the container's
  // postStart hook tails into "kubectl logs", readable here without cluster/kubectl access.
  rpc ListLogFiles (ActiveTerminalsRequest) returns (ListLogFilesReply) {
    option (google.api.http) = { get: "/ListLogFiles" };
  }

  // Content of one log file from \\host.lan\Data\logs (see ListLogFiles). Truncated to the
  // LAST max_bytes bytes if larger (0 = server default, 256 KiB).
  rpc GetLogFile (GetLogFileRequest) returns (GetLogFileReply) {
    option (google.api.http) = { get: "/GetLogFile" };
  }

  // On-demand dump of recent Windows Event Log entries (Service Control Manager events,
  // shutdown/restart events, Application errors) - the same data boot-diag.bat captures on a
  // service state change, available here without waiting for that trigger.
  rpc GetEventLogEntries (GetEventLogEntriesRequest) returns (GetEventLogEntriesReply) {
    option (google.api.http) = { get: "/GetEventLogEntries" };
  }

  // Screenshot of a Windows interactive session's whole desktop - a specific
  // MrpcTerminalUser<N> session, or (if session_user_name is empty) the pod's main/autologon
  // session, the one startup.bat runs in.
  rpc CaptureSessionScreenshot (CaptureSessionScreenshotRequest) returns (CaptureSessionScreenshotReply) {
    option (google.api.http) = { get: "/CaptureSessionScreenshot" };
  }

  // Same as CaptureSessionScreenshot, but fanned out from THIS pod to a DIFFERENT pod by IP
  // (mirroring the ActiveTerminalsCluster fan-out) - a browser can only reach the pod that is
  // currently serving it, not other pods' ClusterIPs, so the cluster admin view asks whichever
  // pod it's connected to relay the request.
  rpc CaptureSessionScreenshotOnPod (CaptureSessionScreenshotOnPodRequest) returns (CaptureSessionScreenshotReply) {
    option (google.api.http) = { get: "/CaptureSessionScreenshotOnPod" };
  }

  // Runs, in-process (LocalSystem, no guest logon/SSH needed), the same refresh
  // startup.bat performs on a successful ONLOGON boot: robocopy published-app (including
  // mrpc-rest) from the host share, then create/start MrpcRestService. Exists because
  // ONLOGON is unreliable (autologon-dependent) - this lets a stuck deploy be repaired
  // through the Terminal Manager's own already-running gRPC/HTTP API instead of waiting
  // on that trigger or requiring interactive guest access.
  rpc RefreshMrpcRest (ActiveTerminalsRequest) returns (RefreshMrpcRestReply) {
    option (google.api.http) = { get: "/RefreshMrpcRest" };
  }


  // Build/version identity of the Terminal Manager running on THIS pod, so a deploy can be
  // VERIFIED rather than guessed. No admin_key required - it exposes no secrets. mrpc-rest
  // transcodes GET /version-tm onto this (its own build is at GET /version).
  rpc GetVersion (VersionRequest) returns (VersionReply) {
    option (google.api.http) = { get: "/version-tm" };
  }

  // Diagnostic MT5/MT4 journal for a SPECIFIC terminal instance on THIS pod: reads the terminal's
  // own journal (logs\*.log) and the expert/script journal (MQL5\logs\*.log) straight from the
  // terminal's working directory. Lets us see WHY a terminal failed to start / log in to the broker
  // without RDP/noVNC access. The terminal must live on the pod serving this request (its record
  // must be in the local registry); if it is on another pod or was already cleaned up, `error` says so.
  rpc GetTerminalJournal (GetTerminalJournalRequest) returns (GetTerminalJournalReply) {
    option (google.api.http) = { get: "/GetTerminalJournal" };
  }

  // One-shot bundle of EVERY diagnostic log available on this pod: every *.log file on the
  // shared Data folder AND in C:\OEM (mrpc.log, mrpc-rest.log, boot-diag.log, startup.log,
  // install.log, ...), plus the Windows Application + System event logs. Each entry carries a
  // tail of its content so a single call gives the full diagnostic picture for the pod without
  // needing to know file names up front (contrast ListLogFiles + N× GetLogFile).
  rpc GetAllLogs (GetAllLogsRequest) returns (GetAllLogsReply) {
    option (google.api.http) = { get: "/GetAllLogs" };
  }

  // Session restore logs for the latest startup sequence on a pod (stored in MongoDB session_restore_logs).
  rpc GetSessionRestoreLogs (GetSessionRestoreLogsRequest) returns (GetSessionRestoreLogsReply) {
    option (google.api.http) = { get: "/GetSessionRestoreLogs" };
  }

  // Session restore watcher status (terminals loaded, queue count, state, diagnostics) for THIS pod.
  rpc GetSessionRestoreStatus (ActiveTerminalsRequest) returns (GetSessionRestoreStatusReply) {
    option (google.api.http) = { get: "/GetSessionRestoreStatus" };
  }

  // Kills all active trial terminals across ALL pods of this StatefulSet/Deployment
  // and marks them stopped in database.
  rpc KillAllTrialTerminals (ActiveTerminalsRequest) returns (KillAllTrialTerminalsReply) {
    option (google.api.http) = {
      get: "/KillAllTrialTerminals"
      additional_bindings {
        post: "/KillAllTrialTerminals"
      }
    };
  }

  // Kills all active trial terminals on THIS pod.
  rpc KillAllTrialTerminalsLocal (ActiveTerminalsRequest) returns (KillAllTrialTerminalsReply) {
    option (google.api.http) = {
      get: "/KillAllTrialTerminalsLocal"
      additional_bindings {
        post: "/KillAllTrialTerminalsLocal"
      }
    };
  }

  // Puts THIS pod into the draining state ahead of shutdown (StatefulSet preStop hook). While draining the
  // pod stops renewing its terminal ownership leases, suppresses crash persistence for terminals ending with
  // the VM, and starts no new work; peers restore its terminals once the leases expire. One-way for the
  // lifetime of the process; calling it again reports already_draining.
  rpc Drain (DrainRequest) returns (DrainReply) {
    option (google.api.http) = {
      post: "/Drain"
      body: "*"
    };
  }

  // Stops THIS pod's local copy of one terminal (pod-to-pod: user-stop fan-out, duplicate prune, rebalance
  // migration). Local only: never forwarded to another pod and never persisted to UserTerminals (the caller
  // records any stop intent). cause is a StopCause name; only customer/API/admin/delete/test stops and
  // InternalReap are accepted. Callers must check reply.error.
  rpc StopTerminalLocal (StopTerminalLocalRequest) returns (StopTerminalLocalReply) {
    option (google.api.http) = {
      post: "/StopTerminalLocal"
      body: "*"
    };
  }
}

message SessionRestoreWatcherStatus {
  bool enabled = 1;                     // whether session restore watcher is active
  string state = 2;                     // "idle" | "reconciling" | "watching" | "disabled" | "starting"
  string reason = 3;                    // last reconcile reason: "startup" | "endpoints-change" | "periodic"
  int32 total_candidates = 4;           // total active tokens found in persistence (Trial + User)
  int32 distinct_tokens = 5;            // distinct tokens after de-duplication
  int32 already_loaded = 6;             // terminals already running in memory (loaded)
  int32 in_queue = 7;                   // terminals remaining in queue to restore
  int32 in_progress = 8;                // terminals currently being restored in-flight
  int32 restored_success = 9;           // terminals restored successfully in current/latest run
  int32 restored_failed = 10;           // terminals failed to restore in current/latest run
  string last_reconcile_start_utc = 11; // ISO timestamp of last reconcile start
  string last_reconcile_end_utc = 12;   // ISO timestamp of last reconcile end
  double last_reconcile_duration_ms = 13;// duration in ms
  string last_error = 14;               // last error message if any
}

message GetSessionRestoreStatusReply {
  SessionRestoreWatcherStatus status = 1;
  string error = 2;
}

message KillAllTrialTerminalsReply {
  int32 killed_count = 1;
  repeated string killed_terminal_ids = 2;
  string message = 3;
  string error = 4;
}

message DrainRequest {
  string admin_key = 1;
  string reason = 2;                 // why the pod drains (e.g. "preStop"); default "AdminDrain"
}
message DrainReply {
  bool draining = 1;                 // the pod is draining (always true on success)
  bool already_draining = 2;         // it was already draining before this call
  string pod = 3;                    // pod name
  string reason = 4;                 // reason of the drain in effect (the first one)
  string started_at = 5;             // ISO-8601 UTC when draining started
  string error = 6;
}

message StopTerminalLocalRequest {
  string admin_key = 1;
  string id = 2;                     // terminal id (any GUID format)
  string cause = 3;                  // StopCause name, e.g. "UserPortal", "UserApi", "InternalReap"
  string detail = 4;                 // reason recorded with the stop (e.g. "DuplicatePrune", "RebalanceMigrate")
  string intent_utc = 5;             // optional ISO-8601 UTC time the stop intent was recorded: a local copy whose
                                     // customer start was requested after it is a newer start and is left running
}
message StopTerminalLocalReply {
  bool stopped = 1;                  // the local copy was stopped by this call
  bool present = 2;                  // this pod had a copy of the terminal (a record owning a process)
  string pod = 3;                    // pod that handled the call
  string error = 4;                  // non-empty when the request was invalid or the stop failed
  int64 full_life_time_seconds = 5;  // lifetime of the stopped copy (0 when nothing was stopped)
  string skipped = 6;                // why a present copy was left running (e.g. it was started after the intent)
}

message GetSessionRestoreLogsRequest {
  string admin_key = 1;
  string pod = 2;
  bool latest_only = 3;
}

message SessionRestoreLogEntry {
  string token_id = 1;
  string platform = 2;
  string reason = 3;
  string owner = 4;
  string user = 5;
  string target = 6;
  bool success = 7;
  string error = 8;
  double elapsed_ms = 9;
  string created_utc = 10;
}

message GetSessionRestoreLogsReply {
  repeated SessionRestoreLogEntry entries = 1;
  string error = 2;
}

message GetAllLogsRequest {
  string admin_key = 1;
  int64 max_bytes_per_log = 2;   // per-source tail cap; 0 = server default (64 KiB)
  bool exclude_event_logs = 3;   // set true to SKIP the Windows Application/System event logs (default: included)
}
message AllLogsEntry {
  string source = 1;             // "file" | "eventlog"
  string name = 2;               // file name, or event log name ("Application"/"System")
  string path = 3;               // full path for files; empty for event logs
  int64 size_bytes = 4;          // file size (files only)
  string modified_at = 5;        // ISO-8601 UTC last-write (files only)
  string content = 6;            // tail of the file, or the joined event entries
  bool truncated = 7;            // file was longer than the cap and was tail-trimmed
  string error = 8;              // per-source read error, if any (others still return)
}
message GetAllLogsReply {
  repeated AllLogsEntry logs = 1;
  string error = 2;              // only set on a whole-call failure
}

message VersionRequest {}
message VersionReply {
  string service = 1;          // "terminal-manager"
  string version = 2;          // AssemblyInformationalVersion (includes git commit)
  string build_time_utc = 3;   // assembly file last-write, ISO-8601
  string mode = 4;             // MT4 / MT5 as this process resolved it
  // Windows session creation on this pod (SessionCreationHealth): "healthy", "unhealthy" (its last
  // consecutive creations all failed - restore placement skips it) or "disabled" (no on-demand sessions).
  string session_creation = 5;
  uint32 session_creation_consecutive_failures = 6;
  string session_creation_last_error = 7;        // "MrpcTerminalUserN: <launcher error>"
  string session_creation_last_success_utc = 8;  // ISO-8601, empty when none yet
  string session_creation_unhealthy_since_utc = 9;
}

message ListLogFilesReply {
  repeated LogFileEntry files = 1;
  string error = 2;
}
message LogFileEntry {
  string name = 1;
  int64 size_bytes = 2;
  google.protobuf.Timestamp modified_at = 3;
}

message GetLogFileRequest {
  string admin_key = 1;
  string file_name = 2;
  int64 max_bytes = 3;              // 0 = server default (last 256 KiB)
}
message GetLogFileReply {
  string content = 1;
  bool truncated = 2;
  int64 total_size_bytes = 3;
  string error = 4;
}

message GetTerminalJournalRequest {
  string admin_key = 1;
  string id = 2;                     // terminal instance GUID (the `id` header value)
  int64 max_bytes = 3;               // per-file cap; 0 = server default (last 128 KiB per file)
}
message TerminalJournalFile {
  string name = 1;                   // relative path, e.g. "logs/20260709.log" or "MQL5/logs/20260709.log"
  string content = 2;
  bool truncated = 3;
  int64 total_size_bytes = 4;
}
message GetTerminalJournalReply {
  string terminal_dir = 1;           // resolved terminal working directory
  repeated TerminalJournalFile files = 2;
  string error = 3;
}

message GetEventLogEntriesRequest {
  string admin_key = 1;
  string log_name = 2;               // "System" or "Application"; default "System"
  int32 max_count = 3;               // 0 = server default (30)
}
message GetEventLogEntriesReply {
  repeated string entries = 1;       // one formatted entry per element (time/level/source/message)
  string error = 2;
}

message CaptureSessionScreenshotRequest {
  string admin_key = 1;
  string session_user_name = 2;      // empty = the pod's main/autologon session
}
message CaptureSessionScreenshotOnPodRequest {
  string admin_key = 1;
  string pod_ip = 2;                 // target pod's ClusterIP (from ActiveTerminalsCluster)
  string session_user_name = 3;      // empty = the target pod's main/autologon session
}
message CaptureSessionScreenshotReply {
  bytes image_png = 1;
  string error = 2;
}

message RefreshMrpcRestReply {
  bool success = 1;
  string message = 2;
  string error = 3;
}

message UsageSample {
  google.protobuf.Timestamp time = 1;
  double cpu_percent = 2;
  uint64 ram_used_mb = 3;
  uint64 ram_total_mb = 4;
}

message SystemUsageReply {
  double cpu_percent = 1;
  uint64 ram_used_mb = 2;
  uint64 ram_total_mb = 3;
  repeated UsageSample history = 4;
  string error = 5;
}

message ActiveTerminalsRequest {
  string admin_key = 1;
}

message TerminalInfo {
  string id = 1;                              // terminal instance GUID (the `id` header)
  uint32 user_number = 2;                     // MrpcTerminalUser<N>
  string windows_user = 3;                    // e.g. "MrpcTerminalUser3"
  uint64 account = 4;                         // MT login
  string server = 5;                          // broker / MT cluster name
  uint32 port = 6;                            // terminal api port
  google.protobuf.Timestamp created_at = 7;
  string windows_password = 8;                // RDP password for windows_user (admin-only)
  optional string name = 9;                   // terminal name or creator identifier
  string state = 10;                          // terminal state: "Starting" | "Authorizing" | "Syncing" | "Connected" | "InvalidAccount" | "Failed" | "Disconnected"
  string error_message = 11;                  // error or reason if failed
  optional string user_email = 12;            // customer email registered to this terminal
  optional double startup_duration_seconds = 13; // duration in seconds from instantiation to Connected
  optional google.protobuf.Timestamp connected_at = 14; // timestamp when Connected state was reached
  optional string startup_time = 15;          // formatted startup duration e.g. "14.2s" or "8s (starting)"
}

message ActiveTerminalsReply {
  string pod = 1;
  string node = 2;
  string pod_ip = 3;
  repeated TerminalInfo terminals = 4;
  string error = 5;
  double cpu_percent = 6;                       // whole-machine CPU % for this pod
  uint64 ram_used_mb = 7;
  uint64 ram_total_mb = 8;
  repeated UsageSample usage_history = 9;       // short CPU/RAM history
  SessionRestoreWatcherStatus restore_status = 10;// live session restore watcher details on this pod
}

message PodTerminals {
  string pod = 1;
  string node = 2;
  string pod_ip = 3;
  string novnc_url = 4;                        // link to the pod's noVNC viewer
  repeated TerminalInfo terminals = 5;
  string error = 6;
  string host_ip = 7;                          // node IP (for the RDP NodePort target)
  double cpu_percent = 8;                       // whole-machine CPU % for this pod
  uint64 ram_used_mb = 9;
  uint64 ram_total_mb = 10;
  repeated UsageSample usage_history = 11;
  SessionRestoreWatcherStatus restore_status = 12;// live session restore watcher details on this pod
}

message ActiveTerminalsClusterReply {
  repeated PodTerminals pods = 1;
}

