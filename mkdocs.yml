site_name: JavaMT5 SDK Documentation
site_url: https://metarpc.github.io/JavaMT5/
site_description: Complete Java SDK for MetaTrader 5 trading automation via gRPC

repo_name: MetaRPC/JavaMT5
repo_url: https://github.com/MetaRPC/JavaMT5
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/language-java
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  custom_dir: docs/includes

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MetaRPC/JavaMT5
      name: JavaMT5 on GitHub

extra_css:
  - styles/custom.css

extra_javascript:
  - javascripts/ux.js

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search

copyright: >
  Copyright © 2024–2025 MetaRPC. MT5 is a trademark of MetaQuotes Software Corp.
  This documentation is community-maintained and not affiliated with MetaQuotes.

nav:
  - Home: index.md

  - Guides:
    - MT5 for Beginners: All_Guides/MT5_For_Beginners.md
    - Getting Started: All_Guides/GETTING_STARTED.md
    - Your First Project: All_Guides/Your_First_Project.md
    - Running Examples: All_Guides/RUNNING_EXAMPLES.md
    - User Code Sandbox: All_Guides/USERCODE_SANDBOX_GUIDE.md
    - Return Codes Reference: All_Guides/RETURN_CODES_REFERENCE.md
    - Enums Usage Reference: All_Guides/ENUMS_USAGE_REFERENCE.md
    - Protobuf Types Explorer: All_Guides/PROTOBUF_INSPECTOR_GUIDE.md
    - Project Map: All_Guides/PROJECT_MAP.md
    - Glossary: All_Guides/GLOSSARY.md
    - gRPC Channel Management: All_Guides/GRPC_CHANNEL_AND_STREAM_MANAGEMENT_EN.md

  - Strategies:
    - Master Overview: Strategies/Strategies.Master.Overview.md
    - Orchestrators:
      - Scalping: Strategies/ScalpingOrchestrator.md
      - Trend Following: Strategies/TrendFollowingOrchestrator.md
      - Hedging: Strategies/HedgingOrchestrator.md
      - Breakout: Strategies/BreakoutOrchestrator.md
      - Martingale: Strategies/MartingaleOrchestrator.md
    - Presets:
      - Aggressive Growth: Strategies/AggressiveGrowthPreset.md
      - Defensive: Strategies/DefensivePreset.md
